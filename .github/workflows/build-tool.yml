name: Build tool

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble the tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (same flags as Light's tool builder)
        run: ./gradlew -DlightSdk.toolOnly=true :tool:testDebugUnitTest :tool:lintDebug :tool:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tool-debug-apk
          path: tool/build/outputs/apk/debug/*.apk
          if-no-files-found: error
